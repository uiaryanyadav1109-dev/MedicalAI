<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 120 120" fill="none" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="mai-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0E1A2D" />
      <stop offset="45%" stop-color="#123E67" />
      <stop offset="100%" stop-color="#0891B2" />
    </linearGradient>

    <!-- Cross Gradient -->
    <linearGradient id="mai-cross" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>

    <!-- Pulse Gradient -->
    <linearGradient id="mai-pulse" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#34D399" />
      <stop offset="40%" stop-color="#38BDF8" />
      <stop offset="70%" stop-color="#F8FAFC" />
      <stop offset="100%" stop-color="#38BDF8" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="mai-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="mai-card-shadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#0E1A2D" flood-opacity="0.35" />
    </filter>
  </defs>

  <!-- Squircle Base with Soft Outer Border -->
  <rect x="6" y="6" width="108" height="108" rx="28" fill="url(#mai-bg)" filter="url(#mai-card-shadow)" />
  <rect x="6.5" y="6.5" width="107" height="107" rx="27.5" stroke="rgba(255,255,255,0.18)" stroke-width="1.5" />

  <!-- Subtle Medical Cross Structure in Background Layer -->
  <g opacity="0.22">
    <!-- Vertical Bar -->
    <rect x="52" y="24" width="16" height="72" rx="8" fill="#FFFFFF" />
    <!-- Horizontal Bar -->
    <rect x="24" y="52" width="72" height="16" rx="8" fill="#FFFFFF" />
  </g>

  <!-- Dynamic AI Pulse / Cardiogram Wave -->
  <path
    d="M 18 60 L 38 60 L 46 44 L 54 76 L 64 28 L 74 88 L 82 54 L 88 64 L 94 60 L 102 60"
    fill="none"
    stroke="url(#mai-pulse)"
    stroke-width="5.5"
    stroke-linecap="round"
    stroke-linejoin="round"
    filter="url(#mai-glow)"
  />

  <!-- High-Precision Neural Nodes at Apexes -->
  <circle cx="64" cy="28" r="4.5" fill="#FFFFFF" filter="url(#mai-glow)" />
  <circle cx="64" cy="28" r="2.2" fill="#0284C7" />

  <circle cx="74" cy="88" r="3.8" fill="#38BDF8" filter="url(#mai-glow)" />
  <circle cx="46" cy="44" r="3" fill="#34D399" />

  <!-- Small AI sparkle indicator on top right -->
  <path
    d="M 92 24 Q 96 24 96 20 Q 96 24 100 24 Q 96 24 96 28 Q 96 24 92 24 Z"
    fill="#38BDF8"
    filter="url(#mai-glow)"
  />
</svg>
